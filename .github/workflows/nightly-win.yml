name: Windows x64 Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  schedule:
    - cron: '30 7 * * 1,5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sources:
    runs-on: ubuntu-24.04
    outputs:
      handbrake: ${{ steps.lock.outputs.handbrake }}
    steps:
      - uses: actions/checkout@v7
      - id: lock
        run: echo "handbrake=$(python3 -c 'import json; print(json.load(open("sources.lock.json"))["handbrake"]["commit"])')" >> "$GITHUB_OUTPUT"

  native:
    name: Windows x64 CLI and hb.dll
    needs: sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: HandBrake/HandBrake
          ref: ${{ needs.sources.outputs.handbrake }}
          path: HandBrake
          fetch-depth: 0
      - name: Prepare and test sources
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/prepare.py HandBrake --platform windows --require-pinned --manifest native/build-manifest.json
          python3 scripts/check_sources.py HandBrake --download work/svt.tar.gz
          git -C HandBrake diff --check
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y automake autoconf build-essential libtool libtool-bin make meson nasm patch tar yasm zlib1g-dev ninja-build gzip pax cmake libssl-dev
          rustup target add x86_64-pc-windows-gnu
      - name: Install verified official x64 UCRT toolchain
        run: |
          python3 scripts/download_toolchain.py toolchains
          echo "$PWD/toolchains/$(python3 -c 'import json; print(json.load(open("sources.lock.json"))["windows_x64_toolchain"]["bin"])')" >> "$GITHUB_PATH"
          echo "$PWD/toolchains/cargo-c" >> "$GITHUB_PATH"
      - name: Build from clean sources
        working-directory: HandBrake
        run: |
          ./configure --cross=x86_64-w64-mingw32 --enable-qsv --enable-vce --enable-nvenc --enable-nvdec --enable-libdovi --launch-jobs=0 --launch
          make -C build pkg.create.zip
      - name: Record native binary provenance
        run: |
          cp HandBrake/build/libhb/hb.dll HandBrake/build/HandBrakeCLI.exe native/
          python3 scripts/manifest.py native
          mkdir -p diagnostics
          cp HandBrake/build/log/* diagnostics/ || true
      - uses: actions/upload-artifact@v7
        with:
          name: native-x64-${{ github.run_id }}
          path: native/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-build-logs
          path: |
            HandBrake/build/log/
            diagnostics/

  gui:
    name: Windows x64 GUI and runtime tests
    needs: [sources, native]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: HandBrake/HandBrake
          ref: ${{ needs.sources.outputs.handbrake }}
          path: HandBrake
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Prepare identical GUI source tree
        run: python scripts/prepare.py HandBrake --platform windows --require-pinned --manifest gui-manifest.json
      - uses: actions/download-artifact@v8
        with:
          name: native-x64-${{ github.run_id }}
          path: native
      - name: Verify matching sources and native binaries
        run: python scripts/manifest.py native --compare gui-manifest.json
      - name: Prepare GUI dependencies
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'
          choco install ffmpeg-full --version=9.0.2 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg installation failed' }
          $publish = 'HandBrake/win/CS/HandBrakeWPF/bin/publish'
          New-Item -ItemType Directory -Force $publish | Out-Null
          Copy-Item native/hb.dll $publish
      - name: Build GUI and installer
        working-directory: HandBrake
        run: dotnet msbuild win/CS/build.xml /t:x64
      - name: Test CLI, encoder and packaged native library
        run: python scripts/smoke_windows.py --native native --publish HandBrake/win/CS/HandBrakeWPF/bin/publish --output smoke-results
      - name: Package matched GUI and CLI
        shell: pwsh
        run: |
          $publish = Resolve-Path 'HandBrake/win/CS/HandBrakeWPF/bin/publish'
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = 'HandBrake-SVT-AV1-HDR-4.3-' + '${{ needs.sources.outputs.handbrake }}'.Substring(0, 12) + '-x64'
          $installer = @(Get-ChildItem $publish -Filter '*Win_GUI.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one installer' }
          Move-Item -LiteralPath $installer[0].FullName -Destination "dist/$name-setup.exe"
          Copy-Item native/build-manifest.json $publish
          Copy-Item native/HandBrakeCLI.exe $publish
          Copy-Item "$publish/portable.ini.template" "$publish/portable.ini"
          Compress-Archive -Path "$publish/*" -DestinationPath "dist/$name-portable.zip"
          Copy-Item native/build-manifest.json dist/
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: HandBrake-Windows-x64
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-runtime-results
          path: smoke-results/

  release:
    needs: gui
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: HandBrake-Windows-x64
          path: dist
      - name: Publish versioned snapshot without removing older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "win-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Windows x64 / SVT-AV1-HDR 4.3' --notes-file .github/workflows/win_rel_body.md
